

<p-table
    #dt
    [value]="movementList"
    [rows]="10"
    [paginator]="true"
    [globalFilterFields]="['id']"
    [tableStyle]="{ 'min-width': '75rem' }"
    [(selection)]="selectedMovement"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [showCurrentPageReport]="true"
>
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Manage Movement </h5>
            <p-iconfield>
                <p-inputicon class="pi pi-search" />
                <input pInputText type="text" (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th style="width: 3rem">
                <p-tableHeaderCheckbox />
            </th>
            <th style="min-width: 16rem">Id</th>

            <th pSortableColumn="description" style="min-width:16rem">
                <div class="flex items-center gap-2">
                     Type
                    <p-sortIcon field="description" />
                </div>
            </th>

            <th pSortableColumn="description" style="min-width:16rem">
                <div class="flex items-center gap-2">
                    Account 
                    <p-sortIcon field="description" />
                </div>
            </th>
            
            <th pSortableColumn="inventoryStatus" style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Debit
                    <p-sortIcon field="inventoryStatus" />
                </div>
            </th>
              <th pSortableColumn="inventoryStatus" style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Credit
                    <p-sortIcon field="inventoryStatus" />
                </div>
            </th>
             <th pSortableColumn="inventoryStatus" style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Balance
                    <p-sortIcon field="inventoryStatus" />
                </div>
            </th>
            <th style="min-width: 12rem"></th>
        </tr>
    </ng-template>
    <ng-template #body let-movement>
        <tr>
            <td style="width: 3rem">
                <p-tableCheckbox [value]="movement" />
            </td>
            <td style="min-width: 12rem">{{ movement.id }}</td>
            <td style="min-width: 16rem">{{ movement.movementType?.id }}</td>
            <td style="min-width: 16rem">{{ movement.account?.id }}</td>
            <td style="min-width: 16rem">{{ movement.debtAmount}}</td>
            <td style="min-width: 16rem">{{ movement.creditAmount }}</td>
            <td style="min-width: 16rem">{{ movement.balanceAmount}}</td>

            <td>
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editMovement(movement)" />
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteMovement(movement)" />
            </td>
        </tr>
    </ng-template>
</p-table>
