<p-toolbar class="topbar">
  <div class="topbar-start">
    <!-- Botón de menú lateral -->
    <p-button 
      icon="pi pi-bars" 
      severity="secondary" 
      text="true"
      (onClick)="onMenuToggle()"
      class="menu-toggle-btn"
      aria-label="Toggle menu">
    </p-button>
    
    <!-- Logo -->
    <div class="logo-container">
      <div class="logo-placeholder">
        <i class="pi pi-chart-bar logo-icon" aria-hidden="true"></i>
        <span class="logo-text">Balance Voix</span>
      </div>
    </div>
  </div>

  <div class="topbar-end">
    <!-- Espacio para futuros elementos como notificaciones, usuario, etc -->
    <p-button 
      icon="pi pi-user" 
      severity="secondary" 
      text="true"
      class="user-btn"
      aria-label="User profile">
    </p-button>
  </div>
</p-toolbar>
